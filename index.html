<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Games website</title>
    <link rel="shortcut icon" href="images/favicon.png" type="image/x-icon" />
    <!-- =========================== font awsome ===========================  -->
    <link rel="stylesheet" href="css/all.min.css" />
    <!-- =========================== bootstrap =========================== -->
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <!-- =========================== main css files =========================== -->
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- =========================== nav bar start =========================== -->
    <nav class="navbar navbar-expand-lg bg-nav-body">
      <div class="container my-2">
        <div class="navbar-brand d-flex align-items-center column-gap-2">
          <i class="fa-solid fa-gamepad"></i>
          GameArena
        </div>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarText"
          aria-controls="navbarText"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarText">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="#home"
                >Home</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#our-games">OUR GAMES</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#what-we-do">What We Do</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#our-team">Our Team</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#contact-us">Contact Us</a>
            </li>
            <hr class="d-none d-sm-block d-md-block d-lg-block" />
          </ul>
          <div class="nav-icons d-flex align-items-center column-gap-3">
            <div
              class="nav-functions w-100 d-flex align-items-center align-items-md-start align-items-lg-center column-gap-3 flex-row flex-sm-column flex-md-column flex-lg-row row-gap-3"
            >
              <div class="notification d-flex column-gap-2">
                <i class="fa-regular fa-bell"></i>
                <span class="d-none d-md-block d-lg-none">Notification</span>
              </div>
              <div class="message d-flex column-gap-2">
                <i class="fa-regular fa-message"></i>
                <span class="d-none d-md-block d-lg-none">Message</span>
              </div>
              <div class="sign-in-button px-3 py-2 rounded-2 w-100 text-center">
                Sign In
              </div>
            </div>
          </div>
        </div>
      </div>
    </nav>
    <!-- =========================== nav bar end =========================== -->
    <!-- =========================== font awsome ===========================  -->
    <script src="js/all.min.js"></script>
    <!-- =========================== bootstrap =========================== -->
    <script src="js/bootstrap.bundle.min.js"></script>
  </body>
</html>

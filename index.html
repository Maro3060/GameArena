<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Games website</title>
    <link rel="shortcut icon" href="images/favicon.png" type="image/x-icon" />
    <link rel="stylesheet" href="css/all.min.css" />
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- ======================== start nav bar ========================  -->
    <nav
      class="navbar navbar-expand-lg py-3 px-6 fixed-top border-bottom border-dark shadow-sm"
    >
      <div class="container">
        <a class="navbar-brand" href="#">
          <i class="fa-solid fa-gamepad me-1"></i>
          GameArena
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarText"
          aria-controls="navbarText"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarText">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="#home"
                >Home</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">OUR GAMES</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">What We Do</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Our Team</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Contact Us</a>
            </li>
          </ul>
          <ul class="navbar-nav mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link"><i class="fa-regular fa-bell"></i></a>
            </li>
            <li class="nav-item me-2">
              <a class="nav-link"><i class="fa-regular fa-message"></i></a>
            </li>
            <li>
              <button class="btn gamey-button btn-shine px-4 py-2">
                Sign In
              </button>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <!-- ======================== end nav bar ========================  -->
    <!-- ======================== start hero section ========================  -->
    <header id="Home">
      <div class="container h-100 d-flex align-items-center">
        <div class="row">
          <div
            class="hero-content col-md-6 d-flex flex-column row-gap-2 justify-content-center"
          >
            <h1>
              THE ULTIMATE<br />
              <span>GAMING</span><br />
              EXPERIENCE
            </h1>
            <p>
              Join millions of gamers worldwide in the most competitive eSports
              tournaments. Experience next-level gaming with cutting-edge
              technology and endless possibilities.
            </p>
            <div class="hero-buttons d-flex flex-row column-gap-3">
              <button class="btn gamey-button px-4 py-3">
                Start Gaming Now
              </button>
              <button class="btn gamey-button px-4 py-3">
                Watch Tournaments
              </button>
            </div>
          </div>
          <div class="hero-img col-md-6 d-flex align-items-center position-relative">
            <div class="inner">
              <img
                src="images/hero-img.png"
                class="w-100 h-100 d-block object-fit-cover rounded-4"
                alt="hero img"
              />
              <div class="floating-box d-flex align-items-center column-gap-3 justify-content-center rounded-3 position-absolute">
                <div class="floating-box-icon">
                  <i class="fa-solid fa-trophy"></i>
                </div>
                <div class="floating-box-data d-flex flex-column">
                  <span>Active Players</span>
                  <span>2.5M+</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </header>
    <!-- ======================== end hero section ========================  -->
    <script src="js/bootstrap.bundle.min.js"></script>
  </body>
</html>
